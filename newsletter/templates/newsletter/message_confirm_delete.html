{% extends 'newsletter/newsletter_base.html' %}
{% load my_tags %}
{% block content %}

<div class="container mt-5">
    <h1 class="mb-4">Удаление сообщения</h1>
    <p>Вы уверены, что хотите удалить сообщение"{{ message.subject_letter }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Удалить</button>
        <a href="{% url 'newsletter:message_list' %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
