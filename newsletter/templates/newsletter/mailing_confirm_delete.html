{% extends 'newsletter/newsletter_base.html' %}
{% block content %}

<div class="container mt-5">
    <h2>Удалить рассылку #{{ object.id }}?</h2>
    <p>Вы уверены?</p>
    
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Да, удалить</button>
        <a href="{% url 'newsletter:mailing_list' %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
