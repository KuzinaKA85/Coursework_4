{% extends 'newsletter/newsletter_base.html' %}
{% load my_tags %}
{% block content %}

<div class="container mt-5">

    <h1 class="mb-4">Список сообщений</h1>
    <a href="{% url 'newsletter:message_form' %}" class="btn btn-primary mb-3">Создать сообщение</a>
    <ul class="list-group">
        {% for message in messages %}

            <li class="list-group-item mb-5">
                <a href="{% url 'newsletter:message_detail' message.pk %}">{{ message.subject_letter }}</a>
                <a href="{% url 'newsletter:message_update' message.pk %}" class="btn btn-sm btn-secondary ml-3">Редактировать</a>
                <a href="{% url 'newsletter:message_confirm_delete' message.pk %}" class="btn btn-sm btn-danger ml-1">Удалить</a>
            </li>
        {% endfor %}
    </ul>
</div>
{% endblock %}
