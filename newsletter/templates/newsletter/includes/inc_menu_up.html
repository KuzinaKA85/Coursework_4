<div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom box-shadow">
    <h5 class="my-0 mr-md-auto font-weight-normal">"Сервис рассылки"</h5>
    <nav class="ms-5">
        <a class="p-2 btn btn-outline-primary" href="{% url 'newsletter:subscriber_list' %}">Список получателей</a>
        <a class="p-2 btn btn-outline-primary" href="{% url 'newsletter:message_list' %}">Список сообщений</a>
        <a class="p-2 btn btn-outline-primary" href="{% url 'newsletter:mailing_list' %}">Список рассылок</a>
        <a class="p-2 btn btn-outline-primary" href="{% url 'newsletter:mailing_attempt_list' %}">Список попыток</a>
        {% if user.is_authenticated %}
        <form action="{% url 'users:logout' %}" method="post" style="display: inline;">
            {% csrf_token %}
            <button type="submit" class="p-2 btn btn-outline-primary">
                Выйти
            </button>
        </form>
        {% else %}
        <a class="p-2 btn btn-outline-primary" href="{% url 'users:login' %}">Вход</a>
        <a class="p-2 btn btn-outline-primary" href="{% url 'users:user_form' %}">Регистрация</a>
        {% endif %}


    </nav>
</div>
